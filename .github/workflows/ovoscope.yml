name: Skill End-to-End Tests (ovoscope)

on:
  pull_request:
    branches: [dev, master, main]
  workflow_dispatch:

jobs:
  ovoscope:
    uses: OpenVoiceOS/gh-automations/.github/workflows/ovoscope.yml@dev
    with:
      python_version: '3.11'
      install_extras: 'test'
      test_path: 'test/end2end/'
      # The skill drives intents via Adapt (info/moves/type) and
      # Padatious (battle). Force the workflow to install both
      # pipeline plugins and their system deps (swig + libfann-dev
      # for padatious' fann2 C extension); otherwise the entire
      # e2e suite is silently skipped.
      require_adapt: true
      require_padatious: true
      # Run serially: Padatious' fann2 C extension crashes under
      # pytest-xdist workers. Each per-locale module boots one
      # single-language MiniCroft (~1-2 min), so the whole five-language
      # matrix still finishes well under the job timeout.
      pytest_workers: '0'
