name: Skill End-to-End Tests (ovoscope)

on:
  pull_request:
    branches: [dev, master, main]
  workflow_dispatch:

jobs:
  ovoscope:
    uses: OpenVoiceOS/gh-automations/.github/workflows/ovoscope.yml@dev
    with:
      python_version: '3.11'
      install_extras: 'test'
      test_path: 'test/end2end/'
      # Install the Adapt pipeline plugin; otherwise the tests that use it
      # are silently skipped.
      require_adapt: true
      # Run serially: each locale boots its own single-language MiniCroft.
      pytest_workers: '0'
