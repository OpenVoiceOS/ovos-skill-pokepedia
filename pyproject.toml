[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ovos-skill-pokepedia"
dynamic = ["version"]
description = "OVOS Pokémon Battle Assistant Skill"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "denix" },
    { name = "OpenVoiceOS", email = "openvoiceos@gmail.com" },
]
keywords = ["ovos", "skill", "pokemon", "battle", "pokeapi"]
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "ovos-spec-tools>=1.11.0a1",
    "ovos-utils>=0.0.38",
    "ovos-workshop>=9.6.7a3,<10.0.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-mock>=3.10.0",
    "pytest-timeout>=2.0.0",
    "requests-mock>=1.10.0",
    "ovoscope>=1.12.1a1",
    "ovos-m2v-pipeline>=0.37.3a1",
]

[project.urls]
Homepage = "https://github.com/OpenVoiceOS/ovos-skill-pokepedia"
Upstream = "https://codeberg.org/denix/ovos-skill-pokepedia"

[project.entry-points."opm.skill"]
"ovos-skill-pokepedia.openvoiceos" = "ovos_skill_pokepedia:PokemonSkill"

[tool.setuptools.dynamic]
version = { attr = "ovos_skill_pokepedia.version.__version__" }

[tool.setuptools.packages.find]
include = ["ovos_skill_pokepedia*"]

[tool.setuptools.package-data]
ovos_skill_pokepedia = ["locale/**/*", "data/**/*.json", "*.json"]

[tool.pytest.ini_options]
ovoscope_min_routing_rate = 0.95
